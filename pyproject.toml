[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brain-rsi"
version = "0.1.0"
description = "Safe, measurable RSI evaluation harness for a Markdown second brain"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
brain-rsi = "brain_rsi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
