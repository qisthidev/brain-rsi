name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Benchmark
        run: python -m brain_rsi.cli benchmark
      - name: Cycle
        run: python -m brain_rsi.cli cycle
      - name: Cycle with snapshot and decision
        run: python -m brain_rsi.cli cycle --snapshot-source --write-decision
      - name: Search
        run: python -m brain_rsi.cli search --num-drafts 4
      - name: Critical regression is rejected (must exit 1)
        run: |
          set +e
          python -m brain_rsi.cli cycle --candidate regressed
          code=$?
          if [ "$code" -ne 1 ]; then
            echo "expected exit 1, got $code"
            exit 1
          fi
